name: Android build

on:
  pull_request:
    branches: [dev, main]
    paths:
      - '.github/workflows/android-build.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'mobile/**'
      - 'wear/**'
      - 'utilities/**'
  push:
    branches: [dev, main]
    paths:
      - '.github/workflows/android-build.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'mobile/**'
      - 'wear/**'
      - 'utilities/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17.0.20+8'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Verify wrapper and toolchain
        run: |
          echo '497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check -
          grep -Fqx 'distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.0-bin.zip' gradle/wrapper/gradle-wrapper.properties
          grep -Fqx 'distributionSha256Sum=553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746' gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version
          ./gradlew verifyPublishedVersioning --no-daemon --max-workers=2 --warning-mode all

      - name: Build, test, and lint
        run: >
          ./gradlew clean
          assembleDebug assembleRelease
          test lint
          :mobile:assembleDebugAndroidTest
          :wear:assembleDebugAndroidTest
          :utilities:assembleDebugAndroidTest
          --no-daemon --max-workers=2 --warning-mode all --stacktrace

      - name: Upload application APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sport-logger-apks
          path: |
            mobile/build/outputs/apk/debug/mobile-debug.apk
            mobile/build/outputs/apk/release/mobile-release-unsigned.apk
            wear/build/outputs/apk/debug/wear-debug.apk
            wear/build/outputs/apk/release/wear-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
