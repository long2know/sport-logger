name: Android Formatter Evidence

on:
  pull_request:
    branches: [dev, main]
    paths:
      - '.github/workflows/android-formatter-evidence.yml'
      - 'tools/android-formatter-evidence/**'
      - 'utilities/src/main/java/com/long2know/utilities/data_access/SqlLogger.java'
      - 'utilities/src/main/java/com/long2know/utilities/models/Config.java'
  push:
    branches: [dev, main]
    paths:
      - '.github/workflows/android-formatter-evidence.yml'
      - 'tools/android-formatter-evidence/**'
      - 'utilities/src/main/java/com/long2know/utilities/data_access/SqlLogger.java'
      - 'utilities/src/main/java/com/long2know/utilities/models/Config.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate committed evidence
        run: python3 tools/android-formatter-evidence/validate_evidence.py

      - name: Run host validator tests
        run: >-
          python3 -m unittest discover
          -s tools/android-formatter-evidence
          -p 'test_*.py'
          -v

      - name: Validate probe and toolchain pins
        run: python3 tools/android-formatter-evidence/run_probe.py --validate-only
