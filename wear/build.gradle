apply plugin: 'com.android.application'
apply plugin: 'androidx.room'

android {
    namespace = 'com.long2know.sportlogger'
    compileSdk = 36
    buildToolsVersion = '36.0.0'
    enableKotlin = false

    defaultConfig {
        applicationId = 'com.long2know.sportlogger'
        minSdk = 26
        targetSdk = 35
        versionCode = rootProject.ext.sportLoggerVersionCode
        versionName = rootProject.ext.sportLoggerVersionName
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
            includeAndroidResources = true
        }
    }

    sourceSets {
        androidTest {
            assets.srcDir file("$projectDir/schemas")
            assets.srcDir file("$projectDir/src/test/resources")
        }
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = true
    }
}

room {
    schemaDirectory "$projectDir/schemas"
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.wear:wear:1.4.0'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation project(path: ':utilities')
    annotationProcessor 'androidx.room:room-compiler:2.8.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.room:room-testing:2.8.5'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'org.robolectric:robolectric:4.17'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.room:room-testing:2.8.5'
}

tasks.named('preBuild').configure {
    dependsOn rootProject.tasks.named('verifyPublishedVersioning')
}
