apply plugin: 'com.android.application'
apply plugin: 'androidx.room'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = 'com.long2know.sportlogger'
    compileSdk = 36
    buildToolsVersion = '36.0.0'
    enableKotlin = true

    defaultConfig {
        applicationId = 'com.long2know.sportlogger'
        minSdk = 30
        targetSdk = 35
        versionCode = rootProject.ext.sportLoggerVersionCode
        versionName = rootProject.ext.sportLoggerVersionName
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
            includeAndroidResources = true
        }
    }

    sourceSets {
        androidTest {
            assets.srcDir file("$projectDir/schemas")
            assets.srcDir file("$projectDir/src/test/resources")
        }
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = true
    }
}

room {
    schemaDirectory "$projectDir/schemas"
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2026.06.01')

    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation composeBom
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.fragment:fragment:1.5.4'
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.wear:wear:1.4.0'
    implementation 'androidx.wear.compose:compose-foundation:1.6.2'
    implementation 'androidx.wear.compose:compose-material:1.6.2'
    implementation 'androidx.health:health-services-client:1.1.0'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation project(path: ':utilities')
    annotationProcessor 'androidx.room:room-compiler:2.8.5'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.room:room-testing:2.8.5'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.health:health-services-client-proto:1.1.0'
    androidTestImplementation composeBom
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.room:room-testing:2.8.5'
}

tasks.named('preBuild').configure {
    dependsOn rootProject.tasks.named('verifyPublishedVersioning')
}
