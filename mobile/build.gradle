apply plugin: 'com.android.application'

android {
    namespace = 'com.long2know.sportlogger'
    compileSdk = 36
    buildToolsVersion = '36.0.0'
    enableKotlin = false

    defaultConfig {
        applicationId = 'com.long2know.sportlogger'
        minSdk = 26
        targetSdk = 36
        versionCode = rootProject.ext.sportLoggerVersionCode
        versionName = rootProject.ext.sportLoggerVersionName
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = true
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation project(':utilities')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

tasks.named('preBuild').configure {
    dependsOn rootProject.tasks.named('verifyPublishedVersioning')
}
