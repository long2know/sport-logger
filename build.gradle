buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.3'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

ext {
    sportLoggerVersionCode = providers.gradleProperty('sportLoggerVersionCode')
            .orElse('1')
            .get()
            .toInteger()
    sportLoggerVersionName = providers.gradleProperty('sportLoggerVersionName')
            .orElse('1.0')
            .get()
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

tasks.register('verifyPublishedVersioning') {
    group = 'verification'
    description = 'Verifies deterministic application version inputs.'
    doLast {
        if (sportLoggerVersionCode < 1) {
            throw new GradleException('sportLoggerVersionCode must be a positive integer')
        }
        if (!(sportLoggerVersionName ==~ /\d+\.\d+(\.\d+)?([.-][0-9A-Za-z.-]+)?/)) {
            throw new GradleException('sportLoggerVersionName must be a stable dotted version')
        }
        logger.lifecycle("SportLogger version ${sportLoggerVersionName} (${sportLoggerVersionCode})")
    }
}
